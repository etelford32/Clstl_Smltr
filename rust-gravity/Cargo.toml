[package]
name = "gravity-kernel"
version = "0.1.0"
edition = "2021"
description = "Gravity Lab N-body kernel: Yoshida-4 symplectic stepping for massive bodies + massless test-particle leapfrog. Mirrors js/gravity-lab/physics.js exactly (parity-gated by the JS harness at 1e-12)."

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
