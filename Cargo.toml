[workspace]
members  = ["crates/disc-hydro", "crates/stellar-mhd-2d"]
resolver = "2"

# Every other Rust crate in this repo predates the disc-hydro workspace and
# is a standalone package with its own Cargo.lock and its own bespoke build
# pipeline (Vercel `build-wasm.sh`, GitHub Actions workflows, etc.).
# Excluding them here stops Cargo from auto-merging them when it walks up
# the directory tree looking for a workspace root — which would otherwise
# break every existing CI / deployment path.
#
# Inventory:
#   rust/          standalone Bevy `star_renderer`     (.github/workflows/build-wasm.yml)
#   rust-sstar/    Sgr A* S-star orbital propagator   (build-wasm.sh)
#   rust-forecast/ space-weather forecasting kernel   (build-wasm.sh)
#   rust-sgp4/     SGP4 satellite propagator          (build-wasm.sh)
#   rust-sunfield/ solar surface field renderer       (build-wasm.sh)
#   rust-sirius/   Sirius A+B binary physics engine   (build-sirius.sh)
exclude  = ["rust", "rust-sstar", "rust-forecast", "rust-sgp4", "rust-sunfield", "rust-sirius"]

[profile.release]
opt-level        = 3
lto              = "fat"
codegen-units    = 1
panic            = "abort"
strip            = "symbols"
overflow-checks  = false
