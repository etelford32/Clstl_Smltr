name: Build and Deploy WASM

on:
  push:
    branches: [ main, master, claude/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install binaryen (wasm-opt)
      run: |
        sudo apt-get update
        sudo apt-get install -y binaryen

    - name: Install wasm-bindgen-cli
      # Schema versions between the CLI and the wasm-bindgen Rust crate must
      # match exactly. Bevy 0.17.x resolves to wasm-bindgen 0.2.121, so the
      # CLI tracks that. When bumping Bevy or wasm-bindgen, update *both*
      # this version pin and the `--precise` step in "Build WASM" below.
      run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: rust/target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build WASM
      run: |
        cd rust
        # rust/Cargo.lock is gitignored, so CI freshly resolves the dep
        # graph each run. Generate a lockfile and pin wasm-bindgen to the
        # same version the CLI was installed at — otherwise the next
        # 0.2.x release will mismatch the CLI's schema and break the build.
        cargo generate-lockfile
        cargo update -p wasm-bindgen --precise 0.2.121
        cargo build --release --target wasm32-unknown-unknown
        wasm-bindgen --out-dir www --target web \
          target/wasm32-unknown-unknown/release/star_renderer.wasm
        wasm-opt -Oz www/star_renderer_bg.wasm -o www/star_renderer_bg.wasm
        ls -lh www/

    - name: Upload WASM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wasm-files
        path: |
          rust/www/*.wasm
          rust/www/*.js

    - name: Upload WASM build (for PRs to pick up)
      uses: actions/upload-artifact@v4
      with:
        name: wasm-build
        path: rust/www/*.wasm
