name: nav-lint

# Canonical-navigation structural gate. Ratchet: green while non-compliance
# stays within scripts/nav-lint-baseline.json (the Phase 1–4 worklist),
# RED on any new page or regression. Mark the `nav-structural-lint` job as a
# required status check in branch protection so parallel sessions cannot
# merge new nav drift.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nav-structural-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: nav structural lint
        run: node scripts/lint-nav.mjs

      # Same failure class as nav drift, one level up: a simulation that ships
      # without a catalog entry is invisible on simulations.html and nothing
      # errors. Eight of them accumulated that way before 2026-08. This gate
      # fails when a root *.html is neither catalogued nor explicitly listed as
      # a non-simulation, when js/nav.js links a page the catalog omits, or
      # when simulations.html is stale against js/simulations-catalog.js.
      # Kept in this job so the existing `nav-structural-lint` required check
      # covers it without touching branch protection.
      - name: simulations catalog gate
        run: node tests/simulations-catalog.mjs

      # The top-level architecture itself (js/site-sections.js): section and
      # group shape, every simulation filed under a group that exists, and the
      # MENU CAP — at most ~10 links per dropdown. That cap is not cosmetic. A
      # panel is absolutely positioned under a 50px bar with nothing to scroll
      # it, so a menu taller than the screen loses its tail silently; the Space
      # Weather menu reached 18 links and cost 7 of them on a 1366x768 laptop.
      # This is the cheap early warning (milliseconds, no browser);
      # tests/nav-responsive.spec.js measures the real rendered height.
      - name: site sections gate
        run: node tests/site-sections.mjs

      # The five section hub pages are generated whole-file from
      # js/site-sections.js. A hand-edit or a stale bake would otherwise ship a
      # page that disagrees with the menu pointing at it.
      - name: section hub pages are in sync
        run: node scripts/build-section-pages.mjs --check
