name: DSMC backend E2E

on:
  push:
    branches:
      - main
    paths:
      - 'dsmc/**'
      - 'js/upper-atmosphere-*.js'
      - 'upper-atmosphere.html'
      - 'tests/upper-atmosphere-e2e.spec.js'
      - '.github/workflows/dsmc-e2e.yml'
      - 'playwright.config.js'
  pull_request:
    paths:
      - 'dsmc/**'
      - 'js/upper-atmosphere-*.js'
      - 'upper-atmosphere.html'
      - 'tests/upper-atmosphere-e2e.spec.js'
      - '.github/workflows/dsmc-e2e.yml'
      - 'playwright.config.js'
  workflow_dispatch:

# One run per ref — a second push supersedes the first.
concurrency:
  group: dsmc-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Auto → SPARTA pill path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      DSMC_API_URL: 'http://localhost:8001'
      TEST_BASE_URL: 'http://localhost:8000'
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      # Docker buildx gives us layer caching via GHA cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache DSMC image layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: dsmc-buildx-${{ hashFiles('dsmc/Dockerfile', 'dsmc/pipeline/requirements.txt') }}
          restore-keys: |
            dsmc-buildx-

      - name: Build DSMC image (no SPARTA — bootstrap only)
        uses: docker/build-push-action@v5
        with:
          context: ./dsmc
          file: ./dsmc/Dockerfile
          build-args: |
            BUILD_SPARTA=0
          tags: parkerphysics/dsmc:ci
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to:   type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Avoid unbounded cache growth. Strip stale lock files first so a
      # crashed builder run on the previous job can't poison the next
      # one's cache directory.
      - name: Rotate buildx cache
        run: |
          rm -rf /tmp/.buildx-cache /tmp/.buildx-cache-new/.lock 2>/dev/null || true
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

      - name: Seed bootstrap SPARTA tables
        working-directory: dsmc
        run: |
          docker compose -f docker-compose.ci.yml run --rm dsmc \
            python3 /app/sparta/generate_tables.py --use-msis-fallback

      - name: Start DSMC API
        working-directory: dsmc
        run: docker compose -f docker-compose.ci.yml up -d dsmc

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fs "$DSMC_API_URL/health" >/dev/null; then
              echo "healthy after $i s"; exit 0
            fi
            echo "Attempt $i: /health not ready, waiting..."
            sleep 1
          done
          echo "DSMC /health never responded — dumping logs"
          docker compose -f dsmc/docker-compose.ci.yml logs --no-color dsmc | tail -400
          exit 1

      - name: Verify profile endpoint returns SPARTA-bootstrap model
        run: |
          # n_points=8 — must be ≥ the endpoint's ge=8 constraint; the
          # downstream Python assertion requires len(samples) ≥ 6, so 8
          # satisfies both. With n_points=6 the endpoint returns HTTP 422
          # (Unprocessable Entity) and curl -fs exits non-zero, which is
          # exactly how this job was failing pre-fix.
          body="$(curl -fs "$DSMC_API_URL/v1/atmosphere/profile?f107=150&ap=15&n_points=8")"
          echo "$body" | head -c 600; echo
          echo "$body" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert 'samples' in d and len(d['samples']) >= 6, 'no samples'
          model = d.get('model', '')
          assert model.startswith('SPARTA'), f'unexpected model: {model!r}'
          print(f'✓ profile returns model={model!r} with {len(d[\"samples\"])} samples')
          "

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium

      # NO manual dev-server step here. playwright.config.js owns the web
      # server (`PORT=8000 node dev-server.mjs`, port 8000, 30s timeout) and
      # starts it for every project.
      #
      # This job used to start its own on 8000 first. That was harmless until
      # 2026-07-10, when #909 added the webServer block to playwright.config.js;
      # from then on Playwright found 8000 occupied and — because
      # reuseExistingServer is `!process.env.CI`, i.e. false in CI — refused to
      # reuse it and hard-failed before running a single test:
      #
      #   Error: http://localhost:8000 is already used, make sure that nothing
      #   is running on the port/url or set reuseExistingServer:true
      #
      # That took the job red on every run from 2026-07-14 onward. It only
      # surfaces when someone touches this workflow's narrow path filter
      # (dsmc/**, upper-atmosphere.html, playwright.config.js …), which is why
      # it sat unnoticed. e2e-auth.yml never had a manual start and never broke.
      # Do not re-add one: let the config own the server.
      - name: Run Playwright E2E
        run: npx playwright test tests/upper-atmosphere-e2e.spec.js --reporter=list

      - name: DSMC logs (always)
        if: always()
        run: docker compose -f dsmc/docker-compose.ci.yml logs --no-color dsmc | tail -200

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down DSMC stack
        if: always()
        working-directory: dsmc
        run: docker compose -f docker-compose.ci.yml down -v
