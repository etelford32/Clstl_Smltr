name: Deploy Celestial Simulator to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygbag

      - name: Build Celestial Studio (web version)
        run: |
          pygbag --build celestial_studio.py || true

      - name: Ensure build/web directory exists
        run: mkdir -p build/web

      - name: Copy all static HTML/JS/CSS files to web build
        run: |
          # Copy all top-level HTML files
          for f in *.html; do
            cp "$f" build/web/ && echo "Copied $f"
          done
          # Copy any top-level CSS/JS if present. The [ -f ] guard handles
          # the case where the glob doesn't match (bash leaves the literal
          # pattern); 2>/dev/null after `in <glob>` is a syntax error in
          # bash because that position only accepts word lists, not redirects.
          for f in *.css *.js; do
            [ -f "$f" ] && cp "$f" build/web/ && echo "Copied $f"
          done
          # Copy JS modules directory
          if [ -d "js" ]; then
            cp -r js build/web/js && echo "Copied js/"
          fi
          # Copy committed data bundles (layout presets/variants, hindcast
          # replays, history). The Layout Lab fetches
          # data/layout-presets/<page>.json and data/layout-variants/ at
          # runtime — omitting data/ silently emptied the preset picker on
          # prod while every local test passed (dev server serves the repo
          # root). Found 2026-07-23; do not remove.
          if [ -d "data" ]; then
            cp -r data build/web/data && echo "Copied data/"
          fi
          # Copy icon + static asset directories. Every page links
          # /icons/favicon-32x32.png, /icons/favicon-16x16.png and
          # /icons/apple-touch-icon.png from <head>; without this they 404
          # in production while resolving fine against the repo root in
          # local dev. static/ holds the og:image art referenced by the
          # hindcast pages. Found 2026-07-25 while auditing the sitemap.
          for d in icons static; do
            if [ -d "$d" ]; then
              cp -r "$d" "build/web/$d" && echo "Copied $d/"
            fi
          done
          # Copy API routes
          if [ -d "api" ]; then
            cp -r api build/web/api && echo "Copied api/"
          fi
          # Copy Rust WASM build output if present
          if [ -d "rust/www" ]; then
            mkdir -p build/web/rust/www
            cp -r rust/www/* build/web/rust/www/ && echo "Copied rust/www/"
          fi
          # Copy static assets (images, logos, etc.)
          for f in *.png *.jpg *.svg *.ico *.webp; do
            [ -f "$f" ] && cp "$f" build/web/ && echo "Copied $f"
          done
          # Copy sitemap/robots/feed. rss.xml is the Field Notes feed that
          # blog.html + every post links via <link rel="alternate">; the
          # globs above only match *.html/*.css/*.js, so without this line
          # the feed link 404s in production while working locally.
          # manifest.json is <link rel="manifest"> on every page — the PWA
          # manifest. Same 404-in-production-only failure as the icons.
          for f in sitemap.xml robots.txt rss.xml llms.txt manifest.json; do
            [ -f "$f" ] && cp "$f" build/web/ && echo "Copied $f"
          done
          # The reproducibility docs the hindcast pages link by name from
          # their Methodology sections ("Reproduce it: event runbook").
          # Enumerated deliberately rather than globbed *.md — a glob would
          # publish CLAUDE.md, AUTH_FLOW_REVIEW.md and every internal plan
          # doc in the repo root. Only files a public page actually links
          # belong here; if you add a doc link to a page, add it here too.
          for f in MHD_DENSITY_PHASE0_GANNON_RUNBOOK.md \
                   GANNON_SIMULATION_DESIGN.md \
                   HINDCAST_STPATRICK_2015_RUNBOOK.md \
                   HINDCAST_DATABASE_STANDARD.md \
                   HINDCAST_BACKLOG.md \
                   RING_CURRENT_SIMULATION_PLAN.md; do
            [ -f "$f" ] && cp "$f" build/web/ && echo "Copied $f"
          done
          # Copy Vercel project config so the deployed branch carries the
          # crons[] / headers / build settings. Without vercel.json in the
          # tree Vercel pulls from gh-pages, the scheduler has no cron
          # registrations and /api/cron/* never fires — even though the
          # handlers are deployed as lambdas. package.json carries
          # "type": "module" so Node serverless functions load as ESM
          # natively instead of going through the ESM→CJS compile step.
          for f in vercel.json package.json; do
            [ -f "$f" ] && cp "$f" build/web/ && echo "Copied $f"
          done
          # List what we're deploying
          echo "--- build/web contents ---"
          ls -lhR build/web/ | head -60

      - name: Write static vercel.json (gh-pages is prebuilt — no WASM build)
        run: |
          # The gh-pages branch is pure static output published by this
          # workflow.  It contains no build-wasm.sh and no rust-*/ source
          # crates, so the source vercel.json's
          #   buildCommand:   "bash build-wasm.sh"
          #   installCommand: "... rustup target add wasm32-unknown-unknown"
          # make Vercel fail with exit 127 ("build-wasm.sh: No such file").
          #
          # peaceiris/actions-gh-pages (force_orphan:false) never deletes a
          # stale vercel.json already on gh-pages, so we must publish a
          # corrected one every deploy.  Derive it from the repo's
          # vercel.json so headers/rewrites/crons stay in sync, but
          # neutralise the build/install commands — the content is already
          # built, Vercel just needs to serve it.
          python - <<'PY'
          import json
          cfg = json.load(open('vercel.json'))
          cfg['buildCommand']   = ''   # nothing to build; static output
          cfg['installCommand'] = ''   # no rustup / npm needed to serve
          cfg['outputDirectory'] = '.'
          cfg['framework'] = None
          json.dump(cfg, open('build/web/vercel.json', 'w'), indent=2)
          print('Wrote build/web/vercel.json (buildCommand/installCommand cleared)')
          print('Preserved keys:', ', '.join(sorted(cfg)))
          PY

      - name: Create project README in build
        run: |
          cat > build/web/README.md << 'EOF'
          # Parker Physics App — etelford32

          Interactive 3D/2D celestial simulations and real-time space weather:
          - **solar-system.html** — Solar System simulation (real-time planet positions)
          - **earth.html** — Earth magnetosphere, weather, satellite data
          - **sun.html** — Solar physics (chromosphere, corona, interior)
          - **space-weather.html** — Space weather dashboard (NOAA/NASA live data)
          - **sirius-planetary.html** — Three.js 3D stellar simulator
          - **dashboard.html** — User dashboard

          https://parkersphysics.com
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy Parker Physics App — ${{ github.ref_name }}'

  build-docker:
    runs-on: ubuntu-latest
    # NOTE: GitHub Actions does NOT allow `secrets.*` in job-level `if:`
    # expressions — secrets aren't part of the workflow-validation context.
    # The canonical workaround is a leading "secrets-check" step that
    # reads the secret into an env var (which IS allowed) and exposes a
    # boolean output the rest of the steps gate on. Each subsequent step
    # then no-ops cleanly when DOCKER_USERNAME isn't configured, instead
    # of the whole workflow failing to parse.
    continue-on-error: true   # Don't fail the whole workflow if Docker build fails
    steps:
      - name: Check Docker Hub credentials
        id: secrets-check
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -n "$DOCKER_USERNAME" ]; then
            echo "available=true"  >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKER_USERNAME secret not set — skipping Docker build."
          fi

      - name: Checkout
        if: steps.secrets-check.outputs.available == 'true'
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        if: steps.secrets-check.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.secrets-check.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: steps.secrets-check.outputs.available == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/star-simulation:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/star-simulation:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/star-simulation:buildcache,mode=max
