name: e2e-auth

# Cross-browser end-to-end auth gate. Runs tests/auth-e2e.spec.js across
# Chromium, Firefox and WebKit against the local dev-server with every Supabase
# call mocked at the network layer (no real backend, no secrets needed).
#
# This is the gate the original sign-in outage lacked: the OAuth-misland
# sentinel + signin happy/error paths are now a required-checkable status.
# Runs on PRs that touch the auth surface, plus a daily scheduled sweep.

on:
  pull_request:
    paths:
      - 'signin.html'
      - 'signup.html'
      - 'auth-callback.html'
      - 'js/auth.js'
      - 'js/oauth-sentinel.js'
      - 'js/nav.js'
      - 'js/auth-funnel.js'
      - 'tests/auth-e2e.spec.js'
      - 'playwright.config.js'
      - 'dev-server.mjs'
      - '.github/workflows/e2e-auth.yml'
  push:
    branches: [main]
  schedule:
    # Daily at 12:50 UTC — just after the synthetic-auth-daily backend robot,
    # so a green morning means both layers passed.
    - cron: '50 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run cross-browser auth E2E
        run: npx playwright test tests/auth-e2e.spec.js
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
