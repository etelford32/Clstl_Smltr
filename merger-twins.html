<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Courier New',monospace; background:#000; color:#c8cbe0; overflow:hidden; }

:root {
    --pp-accent:        #8a7bff;
    --pp-accent-soft:   rgba(138, 123, 255, .12);
    --pp-accent-border: rgba(138, 123, 255, .28);
    --pp-surface-1:     rgba(8, 7, 18, .88);
    --lane-a:           #a99bff;   /* Abell 402-BCG — the pair that IS   */
    --lane-h:           #f0bd55;   /* Holm 15A       — the pair that WAS */
}

.mt-app { position:fixed; inset:0; top:56px; display:flex; flex-direction:column; }
.mt-stage { flex:1; min-height:0; display:flex; }
.mt-view { flex:1; min-width:0; position:relative; }
.mt-view + .mt-view { border-left:1px solid var(--pp-accent-border); }
.mt-canvas { display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
.mt-canvas:active { cursor:grabbing; }

.mt-chip {
    position:absolute; top:10px; left:10px; font-size:10.5px; line-height:1.5;
    padding:5px 9px; border-radius:8px; background:var(--pp-surface-1);
    pointer-events:none; color:#d8daf0;
}
.mt-view.lane-a .mt-chip { border:1px solid var(--lane-a); }
.mt-view.lane-h .mt-chip { border:1px solid var(--lane-h); }
.mt-view.lane-a .mt-chip b:first-child { color:var(--lane-a); }
.mt-view.lane-h .mt-chip b:first-child { color:var(--lane-h); }

.mt-flash {
    position:absolute; top:38%; left:0; right:0; text-align:center; font-size:17px;
    letter-spacing:.14em; text-transform:uppercase; pointer-events:none;
    opacity:0; transition:opacity .25s linear; text-shadow:0 0 12px #000;
}
.mt-view.lane-a .mt-flash { color:var(--lane-a); }
.mt-view.lane-h .mt-flash { color:var(--lane-h); }

.mt-scalebar { position:absolute; bottom:10px; left:12px; display:flex; align-items:center; gap:7px; pointer-events:none; }
.mt-scalebar .bar { height:0; border-top:2px solid #cfd0ff; border-left:2px solid #cfd0ff; border-right:2px solid #cfd0ff; padding-top:3px; }
.mt-scalebar span { font-size:10.5px; color:#dfe1ff; text-shadow:0 0 4px #000; }

.mt-dock {
    flex:none; display:flex; flex-direction:column; gap:6px; padding:8px 12px;
    background:var(--pp-surface-1); border-top:1px solid var(--pp-accent-border);
}
.mt-timerow { display:flex; align-items:center; gap:10px; }
.mt-timerow button, .mt-timerow select {
    font-family:inherit; font-size:11px; background:#111426; color:#cfd0ff;
    border:1px solid var(--pp-accent-border); border-radius:4px; padding:3px 9px; cursor:pointer;
}
.mt-timerow input[type=range] { flex:1; accent-color:var(--pp-accent); }
.mt-timerow .tau { font-size:11.5px; color:#dfe1ff; min-width:210px; text-align:right; }
.mt-timerow label { font-size:10.5px; color:#aab; display:flex; align-items:center; gap:5px; }
.mt-timerow input[type=checkbox] { accent-color:var(--pp-accent); }

.mt-analytics { display:flex; gap:8px; height:150px; }
canvas.mt-chart { height:100%; border:1px solid rgba(138,123,255,.18); border-radius:4px; background:rgba(5,5,12,.6); }
#chartTau { flex:1.7; min-width:0; cursor:crosshair; }
#chartGw { flex:0.9; min-width:0; }
.mt-grid { flex:1.1; min-width:0; overflow-y:auto; border:1px solid rgba(138,123,255,.18); border-radius:4px; padding:5px 8px; background:rgba(5,5,12,.6); }
.mt-gr { display:grid; grid-template-columns: 1.15fr 1fr 1fr; gap:5px; font-size:10.5px; padding:1.5px 0; border-bottom:1px dotted rgba(138,123,255,.12); }
.mt-gr span { color:#889; }
.mt-gr b { font-weight:600; text-align:right; }
.mt-gr b.la { color:var(--lane-a); }
.mt-gr b.lh { color:var(--lane-h); }

@media (max-width: 820px) {
    body { overflow:auto; }
    .mt-app { position:static; height:auto; }
    .mt-stage { flex-direction:column; height:auto; }
    .mt-view { height:38vh; }
    .mt-view + .mt-view { border-left:none; border-top:1px solid var(--pp-accent-border); }
    .mt-analytics { flex-direction:column; height:auto; }
    canvas.mt-chart { height:110px; width:100%; }
    .mt-timerow { flex-wrap:wrap; }
    .mt-timerow .tau { min-width:0; }
}
</style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Merger Twins — Parallel Black Hole Binary Simulations",
  "url": "https://parkersphysics.com/merger-twins.html",
  "applicationCategory": "EducationalApplication",
  "description": "Two physics-calibrated ultramassive black hole binary simulations running in parallel, synchronized on merger-relative time: the Abell 402-BCG candidate pair and the Holm 15A (Abell 85) reconstruction, with shared camera and live comparison analytics.",
  "operatingSystem": "Any",
  "browserRequirements": "WebGL2"
}
</script>
</head>
<body>

<nav aria-label="Primary navigation"></nav>
<link rel="stylesheet" href="js/nav-styles.css">
<script type="module">import { initNav } from "./js/nav.js?v=20260705"; initNav("merger-twins");</script>

<div class="mt-app">
    <div class="mt-stage">
        <div class="mt-view lane-a">
            <canvas id="canvasA" class="mt-canvas" aria-label="Abell 402-BCG pair simulation"></canvas>
            <div id="chipA" class="mt-chip">Abell 402-BCG · loading…</div>
            <div id="flashA" class="mt-flash"></div>
            <div class="mt-scalebar"><div id="sbA" class="bar"></div><span id="sbAl">—</span></div>
        </div>
        <div class="mt-view lane-h">
            <canvas id="canvasH" class="mt-canvas" aria-label="Holm 15A merger-history simulation"></canvas>
            <div id="chipH" class="mt-chip">Holm 15A · loading…</div>
            <div id="flashH" class="mt-flash"></div>
            <div class="mt-scalebar"><div id="sbH" class="bar"></div><span id="sbHl">—</span></div>
        </div>
    </div>

    <div class="mt-dock">
        <div class="mt-timerow">
            <button id="playBtn" type="button">⏸</button>
            <select id="speed" title="playback speed">
                <option value="0.25">¼×</option>
                <option value="1" selected>1×</option>
                <option value="4">4×</option>
            </select>
            <input id="timeline" type="range" min="0" max="1" step="0.0002" value="0"
                   title="shared timeline in τ = time to coalescence">
            <span id="tauLabel" class="tau">—</span>
            <label title="camera distance in units of each system's influence radius">
                match scale <input id="matchScale" type="checkbox" checked></label>
            <label>follow binaries <input id="follow" type="checkbox"></label>
            <button id="viewInfl" type="button" title="zoom both to the influence radius">influence</button>
            <button id="viewCore" type="button" title="zoom both to core scale">core</button>
        </div>
        <div class="mt-analytics">
            <canvas id="chartTau" class="mt-chart" title="click to scrub"></canvas>
            <canvas id="chartGw" class="mt-chart"></canvas>
            <div id="grid" class="mt-grid"></div>
        </div>
    </div>
</div>

<script type="module">
import './js/telemetry.js';
</script>
<script type="module">
import { boot } from './js/abell85/twin.js';

const $ = (id) => document.getElementById(id);
try {
    boot({
        canvasA: $('canvasA'), canvasH: $('canvasH'),
        chipA: $('chipA'), chipH: $('chipH'),
        flashA: $('flashA'), flashH: $('flashH'),
        sbA: $('sbA'), sbAl: $('sbAl'), sbH: $('sbH'), sbHl: $('sbHl'),
        playBtn: $('playBtn'), speed: $('speed'),
        timeline: $('timeline'), tauLabel: $('tauLabel'),
        matchScale: $('matchScale'), follow: $('follow'),
        viewCore: $('viewCore'), viewInfl: $('viewInfl'),
        chartTau: $('chartTau'), chartGw: $('chartGw'), grid: $('grid'),
    });
} catch (err) {
    $('chipA').textContent = '⚠ ' + (err?.message || 'failed to start — WebGL2 required');
    console.error('[merger-twins] boot failed:', err);
}
</script>

</body>
</html>
